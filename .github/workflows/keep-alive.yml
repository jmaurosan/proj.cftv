name: Keep Alive - Supabase

on:
  schedule:
    # Executa a cada 5 dias às 3:00 AM UTC
    - cron: '0 3 */5 * *'
  workflow_dispatch: # Permite execução manual através do painel do GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Keep-Alive Request
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "🔄 Executing keep-alive for Supabase..."
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Limpar eventuais espaços em branco, aspas ou quebras de linha (\r) dos Secrets
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r\n" ')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n" ')

          if [ -z "$CLEAN_URL" ] || [ -z "$CLEAN_KEY" ]; then
            echo "❌ ERROR: SUPABASE_URL or SUPABASE_ANON_KEY is missing."
            echo "Please ensure you have configured VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in your repository's Actions Secrets."
            exit 1
          fi

          echo "📍 Supabase URL is configured."

          # Desabilita o encerramento do script caso o cURL encontre instabilidade de rede temporária
          set +e

          # Tabelas do projeto CFTV — consulta uma principal é suficiente para acordar a API e o Postgres
          echo "📊 Querying table: clients..."
          query_1_response=$(curl -s -w "\n%{http_code}" -X GET \
            "${CLEAN_URL}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}")

          echo "📊 Querying table: dvrs..."
          query_2_response=$(curl -s -w "\n%{http_code}" -X GET \
            "${CLEAN_URL}/rest/v1/dvrs?select=id&limit=1" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}")

          echo "📊 Querying table: cameras..."
          query_3_response=$(curl -s -w "\n%{http_code}" -X GET \
            "${CLEAN_URL}/rest/v1/cameras?select=id&limit=1" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}")

          # Re-habilita a tratativa de erro do bash
          set -e

          # Checa apenas pelo status HTTP da primeira query; se diferente de 200 ainda marca como ativo mas alerta
          STATUS_1=$(echo "$query_1_response" | tail -n1)
          STATUS_2=$(echo "$query_2_response" | tail -n1)
          STATUS_3=$(echo "$query_3_response" | tail -n1)

          echo "   → clients: HTTP $STATUS_1"
          echo "   → dvrs:    HTTP $STATUS_2"
          echo "   → cameras: HTTP $STATUS_3"

          if [[ "$STATUS_1" == "200" || "$STATUS_2" == "200" || "$STATUS_3" == "200" ]]; then
            echo "✅ Keep-alive executed successfully!"
            exit 0
          else
            echo "⚠️ Queries may have failed (HTTP status not 200). DB might still be active just handling RLS or 401s."
            exit 0
          fi

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Keep-alive job completed successfully at $(date)"
          echo "Next execution in 5 days"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Keep-alive job failed at $(date)"
          echo "Please check the logs and Supabase status"
